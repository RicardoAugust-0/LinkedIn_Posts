# fly.toml app configuration file generated for linkedmaker on 2026-05-26T23:10:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'linkedmaker'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:/data/posts.db'
  FRONTEND_URL = 'https://seu-app-frontend.vercel.app'
  HOST = '0.0.0.0'
  PORT = '3000'

[[mounts]]
  source = 'posts_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
